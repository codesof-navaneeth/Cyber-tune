<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>CYBER//TUNE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: white;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .app {
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      opacity: .45;
    }

    p {
      opacity: .55;
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="logo">
      CYBER<span>//</span>TUNE
    </div>

    <p>Initializing audio system...</p>
  </main>

</body>
</html>
