lur(20px);display:grid;place-items:center;text-align:center;padding:30px;box-shadow:inset 0 1px rgba(255,255,255,.07)}.empty-inner{max-width:420px}.empty-icon{font-size:40px;color:var(--accent);margin-bottom:13px;animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.08);filter:drop-shadow(0 0 16px rgba(216,255,62,.3))}}.empty h3{margin:0 0 8px}.empty p{margin:0 0 20px;color:var(--muted);line-height:1.65}.track-list{display:grid;gap:4px}.track{width:100%;min-height:68px;padding:8px;border-radius:14px;background:transparent;display:grid;grid-template-columns:50px minmax(0,1fr) auto auto;gap:13px;align-items:center;text-align:left;transition:.35s var(--ease)}.track:hover{background:linear-gradient(100deg,rgba(255,255,255,.07),rgba(255,255,255,.025));transform:translateX(4px)}.art{width:50px;height:50px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--accent);background:radial-gradient(circle at 30% 20%,rgba(216,255,62,.25),transparent 35%),linear-gradient(135deg,#292e38,#101217)}.art img{width:100%;height:100%;object-fit:cover}.info{min-width:0}.title,.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{font-size:13px;font-weight:750}.sub{margin-top:4px;color:var(--muted);font-size:11px}.heart{background:transparent;color:var(--muted);font-size:18px;padding:7px}.heart.active{color:var(--accent)}.duration{color:var(--muted);font:10px monospace}.library-head{display:flex;justify-content:space-between;align-items:end;margin:25px 0 17px}.library-head h1,.search h1{margin:0;font-size:clamp(38px,5vw,58px);letter-spacing:-.07em}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:15px}.tab{background:transparent;color:var(--muted);padding:9px 13px;border-radius:10px;white-space:nowrap}.tab.active{background:var(--glass);border:1px solid var(--line);color:var(--text)}.search{padding-top:45px}.search-box{position:relative;margin:25px 0 30px}.search-box input{width:100%;padding:18px 20px r(30px);overflow:auto}.now.open{display:flex}.now-top{height:75px;padding:0 24px;display:flex;justify-content:space-between;align-items:center}.now-art-wrap{width:min(500px,76vw);aspect-ratio:1;margin:auto;display:grid;place-items:center}.now-art{width:100%;height:100%;border-radius:22px;overflow:hidden;display:grid;place-items:center;color:var(--accent);font-size:80px;background:radial-gradient(circle at 30% 20%,rgba(216,255,62,.25),transparent 35%),linear-gradient(135deg,#292e38,#101217);box-shadow:0 40px 100px rgba(0,0,0,.45)}.now-art img{width:100%;height:100%;object-fit:cover}.now.playing .now-art{animation:albumFloat 5s ease-in-out infinite}@keyframes albumFloat{50%{transform:scale(1.018) rotate(.3deg);box-shadow:0 45px 110px rgba(216,255,62,.07)}}.now-info,.now-progress,.now-controls{width:min(650px,calc(100% - 35px));margin-left:auto;margin-right:auto}.now-info{margin-top:28px}.now-title{font-size:clamp(27px,4vw,43px);font-weight:850;letter-spacing:-.06em}.now-artist{color:var(--muted);margin-top:7px}.range{width:100%;accent-color:var(--accent)}.time{display:flex;justify-content:space-between;color:var(--muted);font:10px monospace}.now-progress{margin-top:18px}.now-controls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:12px;margin-bottom:35px}.big{width:48px;height:48px;background:transparent;border-radius:50%;font-size:25px}.big-play{width:65px;height:65px;background:var(--text);color:#08090d}.mode{color:var(--accent)}dialog{width:min(450px,calc(100% - 30px));background:rgba(18,21,27,.82);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:22px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 30px 100px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between}.settings{display:grid;gap:13px;margin-top:25px}.setting{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.danger{padding:13px;background:rgba(255,80,80,.08);color:#ff9292;text-align:left;border-radius:10px}.toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:rgba(25,28,35,.86);border:1px solid var(--line);backdrop-filter:blur(20px);padding:11px 15px;border-radius:11px;font-size:12px;transition:.35s var(--ease);z-index:200}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){:root{--player:70px}.sidebar{display:none}.main{margin-left:0;padding-bottom:calc(var(--player) + 58px)}.topbar{height:65px;padding:0 17px;justify-content:space-between}.mobile-brand{display:block}.content{padding:0 17px 45px}.hero{padding:38px 0 25px}.hero h1{font-size:clamp(43px,13vw,64px)}.library-head{display:block}.library-head h1{margin-bottom:13px}.track{grid-template-columns:44px minmax(0,1fr) auto}.track .heart{display:none}.art{width:44px;height:44px}.mini{left:0;padding:8px 11px}.mini-main{width:auto;flex:1}.mini .player:first-of-type{display:none}.progress{position:absolute;top:0;left:0;right:0}.mobile-nav{position:fixed;left:0;right:0;bottom:var(--player);height:58px;background:rgba(10,12,16,.78);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-top:1px solid var(--line);display:flex;z-index:65}.mobile-nav button{width:33.333%;background:transparent;color:var(--muted);display:grid;place-items:center;gap:1px}.mobile-nav b{font-size:18px;font-weight:400}.mobile-nav small{font-size:9px}.mobile-nav .active{color:var(--text)}.mobile-nav .active b{color:var(--accent)}.now-art-wrap{width:min(84vw,430px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="orb"></div>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="mark">C//</span>CYBER<span class="accent">//</span>TUNE</div><nav class="nav"><button class="active" data-route="home"><b>⌂</b>Home</button><button data-route="library"><b>▤</b>Library</button><button data-route="search"><b>⌕</b>Search</button></nav><div class="local"><i></i> LOCAL / OFFLINE</div></aside>
<main class="main"><header class="topbar"><div class="mobile-brand">CYBER<span class="accent">//</span>TUNE</div><div class="actions"><button class="icon import" id="import">＋</button><button class="icon" id="settings">⚙</button></div></header><div class="content" id="content"></div></main>
<nav class="mobile-nav"><button class="active" data-route="home"><b>⌂</b><small>Home</small></button><button data-route="library"><b>▤</b><small>Library</small></button><button data-route="search"><b>⌕</b><small>Search</small></button></nav>
<section class="mini"><button class="mini-main" id="openNow"><div class="mini-art" id="miniArt">♪</div><div class="mini-copy"><strong id="miniTitle">Nothing playing</strong><span id="miniArtist">Import music to begin</span></div></button><div class="progress" id="miniProgress"><span id="progressFill"></span></div><button class="player" id="prev">‹</button><button class="player play" id="play">▶</button><button class="player" id="next">›</button></section>
<input id="files" type="file" hidden multiple accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg">
<section class="now" id="now"><header class="now-top"><button class="icon" id="closeNow">×</button><div class="eyebrow">NOW PLAYING</div><button class="icon" id="favorite">♡</button></header><div class="now-art-wrap"><div class="now-art" id="nowArt">♪</div></div><div class="now-info"><div class="now-title" id="nowTitle">Nothing playing</div><div class="now-artist" id="nowArtist">Import music to begin</div></div><div class="now-progress"><input class="range" id="range" type="range" min="0" max="100" value="0" step=".1"><div class="time"><span id="current">0:00</span><span id="total">0:00</span></div></div><div class="now-controls"><button class="big" id="shuffle">⤨</button><button class="big" id="npPrev">‹</button><button class="big big-play" id="npPlay">▶</button><button class="big" id="npNext">›</button><button class="big" id="repeat">↻</button></div></section>
<dialog id="dialog"><div class="dialog-head"><div><p class="eyebrow">SYSTEM</p><h2>Settings</h2></div><button class="icon" id="closeSettings">×</button></div><div class="settings"><label class="setting"><span>Reduced motion</span><input type="checkbox" id="reduced"></label><button class="danger" id="clear">Clear local library</button></div></dialog>
<div class="toast" id="toast"></div>
</div>
<script>
const DB="cyber-tune",state={route:"home",tracks:[],queue:[],index:-1,current:null,query:"",shuffle:false,repeat:"off",favorites:new Set(),history:[],plays:{}};const audio=new Audio();audio.preload="metadata";let db,url=null;const $=s=>document.querySelector(s);const content=$("#content");
function time(s){return Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`:"0:00"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(x){$("#toast").textContent=x;$("#toast").classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toast").classList.remove("show"),2200)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains("tracks"))e.target.result.createObjectStore("tracks",{keyPath:"id"})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function all(){return new Promise((res,rej)=>{const r=db.transaction("tracks").objectStore("tracks").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{const t=db.transaction("tracks","readwrite");t.objectStore("tracks").put(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function clearDB(){return new Promise((res,rej)=>{const t=db.transaction("tracks","readwrite");t.objectStore("tracks").clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function save(){localStorage.setItem("ct-state",JSON.stringify({favorites:[...state.favorites],history:state.history,plays:state.plays,shuffle:state.shuffle,repeat:state.repeat,reduced:state.reducedMotion}))}function load(){try{const x=JSON.parse(localStorage.getItem("ct-state")||"{}");state.favorites=new Set(x.favorites||[]);state.history=x.history||[];state.plays=x.plays||{};state.shuffle=!!x.shuffle;state.repeat=x.repeat||"off";state.reducedMotion=!!x.reduced}catch{}}
function trackList(list){if(!list.length)return `<div class="empty"><div class="empty-inner"><div class="empty-icon">◈</div><h3>Your local library is empty</h3><p>Select music from your device. CYBER//TUNE never uploads your audio.</p><button class="primary" data-import>＋ Import Music</button></div></div>`;return `<div class="track-list">${list.map(t=>`<div class="track" data-id="${esc(t.id)}" tabindex="0"><div class="art">${t.artwork?`<img src="${t.artwork}" alt="">`:"♪"}</div><div class="info"><strong class="title">${esc(t.title)}</strong><span class="sub">${esc(t.artist)} · ${esc(t.album)}</span></div><button class="heart ${state.favorites.has(t.id)?"active":""}" data-fav="${esc(t.id)}">${state.favorites.has(t.id)?"♥":"♡"}</button><span class="duration">${time(t.duration)}</span></div>`).join("")}</div>`}
function home(){const recent=state.history.map(id=>state.tracks.find(t=>t.id===id)).filter(Boolean).slice(0,8);content.innerHTML=`<section class="hero"><p class="eyebrow">PRIVATE AUDIO / LOCAL-FIRST</p><h1>Your music.<br>Nothing else.</h1><p class="copy">A personal futuristic music terminal built around the files you already own. Offline by design.</p><button class="primary" data-import>＋ Import Music</button></section><section class="section"><div class="section-head"><div><p class="eyebrow">LIBRARY</p><h2>${recent.length?"Recently played":"Ready when you are"}</h2></div><span class="count">${state.tracks.length} TRACKS</span></div>${recent.length?trackList(recent):trackList([])}</section>`}
function library(){content.innerHTML=`<div class="library-head"><div><p class="eyebrow">COLLECTION</p><h1>Library</h1></div><span class="count">${state.tracks.length} TRACKS</span></div><div class="tabs"><button class="tab active">Songs</button><button class="tab" data-sort="title">A–Z</button><button class="tab" data-sort="plays">Most played</button><button class="tab" data-sort="recent">Recent</button></div>${trackList(state.tracks)}`}
function search(){const q=state.query.trim().toLowerCase();const r=q?state.tracks.filter(t=>[t.title,t.artist,t.album,t.genre,t.folder].join(" ").toLowerCase().includes(q)):[];content.innerHTML=`<section class="search"><p class="eyebrow">LOCAL INDEX</p><h1>Search.</h1><div class="search-box"><span class="search-symbol">⌕</span><input id="searchInput" value="${esc(state.query)}" placeholder="Search your music…" autocomplete="off"></div></section>${q?(r.length?trackList(r):`<div class="empty"><div class="empty-inner"><div class="empty-icon">⌕</div><h3>No matches</h3><p>Nothing matches “${esc(state.query)}”.</p></div></div>`):trackList([])}`;const i=$("#searchInput");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}function render(){document.querySelectorAll("[data-route]").forEach(b=>b.classList.toggle("active",b.dataset.route===state.route));state.route==="home"?home():state.route==="library"?library():search()}
async function importFiles(files){let n=0;for(const f of files){if(!f.type.startsWith("audio/")&&!/\.(mp3|wav|flac|m4a|aac|ogg)$/i.test(f.name))continue;const id=`${f.name}:${f.size}:${f.lastModified}`;if(state.tracks.some(t=>t.id===id))continue;const a=document.createElement("audio"),u=URL.createObjectURL(f);a.src=u;await new Promise(done=>{const end=()=>{URL.revokeObjectURL(u);done()};a.addEventListener("loadedmetadata",end,{once:true});a.addEventListener("error",end,{once:true})});const title=f.name.replace(/\.[^.]+$/i,"").replace(/[_-]+/g," ");const t={id,title:title||"Unknown title",artist:"Unknown artist",album:"Unknown album",genre:"",folder:"Local files",duration:Number.isFinite(a.duration)?a.duration:0,file:f,artwork:null};try{await put(t);state.tracks.push(t);n++}catch{toast("Could not save "+f.name)}}render();if(n)toast(`${n} track${n===1?"":"s"} imported`)}
function play(id){const t=state.tracks.find(x=>x.id===id);if(!t)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(t.file);audio.src=url;state.current=id;state.queue=state.queue.length?state.queue:state.tracks.map(x=>x.id);state.index=Math.max(0,state.queue.indexOf(id));audio.play().then(()=>record(t)).catch(()=>toast("This file could not be played"));updatePlayer()}
function toggle(){if(!state.current){if(state.tracks[0])play(state.tracks[0].id);return}audio.paused?audio.play():audio.pause()}function next(){if(!state.queue.length)state.queue=state.tracks.map(t=>t.id);if(!state.queue.length)return;let i=state.shuffle?Math.floor(Math.random()*state.queue.length):state.index+1;if(i>=state.queue.length){if(state.repeat==="all")i=0;else return audio.pause()}state.index=i;play(state.queue[i])}function prev(){if(audio.currentTime>3)return audio.currentTime=0;if(state.index>0){state.index--;play(state.queue[state.index])}}
function record(t){state.history=[t.id,...state.history.filter(x=>x!==t.id)].slice(0,50);state.plays[t.id]=(state.plays[t.id]||0)+1;save()}function updatePlayer(){const t=state.tracks.find(x=>x.id===state.current);$("#miniTitle").textContent=t?.title||"Nothing playing";$("#miniArtist").textContent=t?.artist||"Import music to begin";$("#nowTitle").textContent=t?.title||"Nothing playing";$("#nowArtist").textContent=t?`${t.artist} · ${t.album}`:"Import music to begin";const art=t?.artwork?`<img src="${t.artwork}" alt="">`:"♪";$("#miniArt").innerHTML=art;$("#nowArt").innerHTML=art;const p=!audio.paused;$("#play").textContent=p?"Ⅱ":"▶";$("#npPlay").textContent=p?"Ⅱ":"▶";$("#now").classList.toggle("playing",p);$("#favorite").textContent=t&&state.favorites.has(t.id)?"♥":"♡"}audio.addEventListener("play",updatePlayer);audio.addEventListener("pause",updatePlayer);audio.addEventListener("timeupdate",()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;$("#progressFill").style.width=p+"%";$("#range").value=p;$("#current").textContent=time(audio.currentTime);$("#total").textContent=time(audio.duration)});audio.addEventListener("ended",()=>state.repeat==="one"?(audio.currentTime=0,audio.play()):next());audio.addEventListener("error",()=>toast("Playback error — unsupported or damaged file"));
$("#play").onclick=toggle;$("#npPlay").onclick=toggle;$("#next").onclick=next;$("#npNext").onclick=next;$("#prev").onclick=prev;$("#npPrev").onclick=prev;$("#range").oninput=()=>audio.duration&&(audio.currentTime=+$("#range").value/100*audio.duration);$("#miniProgress").onclick=e=>{if(audio.duration){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration}};
$("#shuffle").onclick=()=>{state.shuffle=!state.shuffle;$("#shuffle").classList.toggle("mode",state.shuffle);save()};$("#repeat").onclick=()=>{state.repeat=state.repeat==="off"?"all":state.repeat==="all"?"one":"off";$("#repeat").classList.toggle("mode",state.repeat!=="off");$("#repeat").textContent=state.repeat==="one"?"↻¹":"↻";save()};$("#favorite").onclick=()=>{if(state.current){state.favorites.has(state.current)?state.favorites.delete(state.current):state.favorites.add(state.current);save();updatePlayer();render()}};
$("#openNow").onclick=()=>state.current&&$("#now").classList.add("open");$("#closeNow").onclick=()=>$("#now").classList.remove("open");$("#settings").onclick=()=>$("#dialog").showModal();$("#closeSettings").onclick=()=>$("#dialog").close();$("#import").onclick=()=>$("#files").click();$("#files").onchange=e=>{importFiles([...e.target.files]);e.target.value=""};
document.addEventListener("click",e=>{const imp=e.target.closest("[data-import]");if(imp)$("#files").click();const r=e.target.closest("[data-route]");if(r){state.route=r.dataset.route;render()}const t=e.target.closest("[data-id]");if(t&&!e.target.closest("[data-fav]"))play(t.dataset.id);const f=e.target.closest("[data-fav]");if(f){e.stopPropagation();const id=f.dataset.fav;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);save();render()};const s=e.target.closest("[data-sort]");if(s){const type=s.dataset.sort;if(type==="title")state.tracks.sort((a,b)=>a.title.localeCompare(b.title));if(type==="plays")state.tracks.sort((a,b)=>(state.plays[b.id]||0)-(state.plays[a.id]||0));if(type==="recent")state.tracks.sort((a,b)=>b.lastModified-a.lastModified);render()}});document.addEventListener("input",e=>{if(e.target.id==="searchInput"){state.query=e.target.value;search()}if(e.target.id==="reduced"){state.reducedMotion=e.target.checked;save()}});$("#clear").onclick=async()=>{if(confirm("Delete the local CYBER//TUNE library?")){await clearDB();state.tracks=[];state.queue=[];state.current=null;audio.pause();audio.removeAttribute("src");save();$("#dialog").close();render();updatePlayer();toast("Local library cleared")}};
async function init(){load();$("#reduced").checked=state.reducedMotion;try{await openDB();state.tracks=await all()}catch{toast("IndexedDB is unavailable in this browser")};render();updatePlayer()}init();
</script>
