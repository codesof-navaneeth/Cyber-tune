<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0d">
  <meta name="description" content="CYBER//TUNE — a private offline-first music player for music you own.">
  <title>CYBER//TUNE</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">C//</span><span>CYBER<span class="accent">//</span>TUNE</span></div>
      <nav class="side-nav" aria-label="Primary">
        <button class="nav-btn active" data-route="home"><span>⌂</span>Home</button>
        <button class="nav-btn" data-route="library"><span>▤</span>Library</button>
        <button class="nav-btn" data-route="search"><span>⌕</span>Search</button>
      </nav>
      <div class="local-status"><i></i> LOCAL ONLY</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="mobile-brand">CYBER<span>//</span>TUNE</div>
        <div class="top-actions">
          <button class="icon-button" id="importBtn" aria-label="Import music" title="Import music">＋</button>
          <button class="icon-button" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
        </div>
      </header>
      <div class="content" id="content" tabindex="-1"></div>
    </main>

    <nav class="mobile-nav" aria-label="Mobile">
      <button class="mobile-nav-btn active" data-route="home"><span>⌂</span><small>Home</small></button>
      <button class="mobile-nav-btn" data-route="library"><span>▤</span><small>Library</small></button>
      <button class="mobile-nav-btn" data-route="search"><span>⌕</span><small>Search</small></button>
    </nav>

    <section class="mini-player" id="miniPlayer" aria-label="Player">
      <button class="mini-main" id="openNowPlaying" aria-label="Open now playing">
        <div class="art art-small" id="miniArt">♪</div>
        <div class="mini-copy"><strong id="miniTitle">Nothing playing</strong><span id="miniArtist">Import your music to begin</span></div>
      </button>
      <div class="mini-progress"><span id="miniProgress"></span></div>
      <button class="player-control" id="prevBtn" aria-label="Previous">‹</button>
      <button class="play-button" id="playBtn" aria-label="Play">▶</button>
      <button class="player-control" id="nextBtn" aria-label="Next">›</button>
    </section>

    <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg" multiple hidden>
    <dialog id="settingsDialog">
      <div class="dialog-head"><div><p class="eyebrow">System</p><h2>Settings</h2></div><button class="icon-button" data-close-dialog aria-label="Close">×</button></div>
      <div class="settings-list">
        <label><span>Reduced motion</span><input id="reducedMotion" type="checkbox"></label>
        <button class="danger" id="clearLibrary">Clear local library</button>
      </div>
    </dialog>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
